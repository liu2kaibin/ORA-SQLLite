name: PR CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Linux MVP validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: rustup run stable cargo fmt --check
      - name: Check all targets
        run: rustup run stable cargo check --all-targets
      - name: Run MVP API tests
        run: rustup run stable cargo test --test public_api --test phase4c_api --test phase4c2_constraint_api
